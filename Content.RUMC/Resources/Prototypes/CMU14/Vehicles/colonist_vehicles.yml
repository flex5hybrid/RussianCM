- type: entity
  parent: VehicleVanBase
  id: AU14VehicleCivCar
  name: Civilian car
  description: An old passenger car. Not much to look at, but it still runs.
  components:
  # CMU14 Tuning Begin: slots for civilian vehicle modules (wheel slot repeated from the base)
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-armor: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-front: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-engine: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-turret: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: HardpointSlots
    vehicleFamily: Van
    slots:
    - id: wheel-1
      visualLayer: cmu-wheels
      disableEject: true
      hardpointType: Wheel
      slotType: Wheel
      insertDelay: 1.5
      whitelist:
        components:
        - VehicleWheelItem
    - id: cmu-armor
      visualLayer: cmu-armor
      disableEject: true
      hardpointType: Armor
      slotType: Armor
      required: false
      insertDelay: 3.0
    - id: cmu-front
      visualLayer: cmu-front
      disableEject: true
      hardpointType: FrontAttachment
      slotType: FrontAttachment
      required: false
      insertDelay: 3.0
    - id: cmu-engine
      disableEject: true
      hardpointType: SupportAttachment
      slotType: SupportAttachment
      required: false
      insertDelay: 3.0
    - id: cmu-turret
      disableEject: true
      hardpointType: Turret
      slotType: Turret
      required: false
      insertDelay: 3.0
  - type: VehicleHardpointVisuals
  - type: CMUVehicleTurretMount
    north: -1,8
    east: -9,16
    south: -1,12
    west: 7,16
  # CMU14 Tuning End
  - type: Damageable
    damageModifierSet: VehicleFrameHumvee
  - type: Injurable
    damageContainer: StructuralMarine
  - type: MeleeReceivedMultiplier
    xenoMultiplier: 1
    otherMultiplier: 1
  - type: HardpointIntegrity
    maxIntegrity: 1000
    bypassEntryOnZero: true
    integrity: 1000
  - type: Sprite
    scale: 1.1, 1.1
    sprite: CMU14/Structures/vehicles/car.rsi
    layers:
    - map: [ base ]
      state: car_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
    # CMU14 Tuning Begin: the fitted civilian vehicle modules, shown by VehicleHardpointVisuals
    - map: [ cmu-wheels ]
      sprite: CMU14/Structures/vehicles/tuning_car.rsi
      state: wheels_armoured
      visible: false
    - map: [ cmu-armor ]
      sprite: CMU14/Structures/vehicles/tuning_car.rsi
      state: armour
      visible: false
    - map: [ cmu-front ]
      sprite: CMU14/Structures/vehicles/tuning_car.rsi
      state: bullbar_spiked
      visible: false
    # CMU14 Tuning End
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.4675,-1.32,0.4675,1.32
        density: 1000
        hard: true
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.4675,-1.32,0.4675,1.32
        density: 1000
        hard: true
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: VehicleSound
    collisionSoundCooldown: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/CMU14/Vehicles/Interiors/truck_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 4
    maxXenos: 1
    entryPoints:
    - offset: 0,0
      radius: 0.11
      interiorCoords: 3.5,-0.5
    - offset: -1.1,-0.275
      radius: 0.66
      interiorCoords: 3.5,-0.5
    - offset: 1.1,-0.275
      radius: 0.66
      interiorCoords: 3.5,-0.5

