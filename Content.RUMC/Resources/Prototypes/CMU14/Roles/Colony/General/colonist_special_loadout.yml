# Base for boxes that unpack a machine or vehicle when used in hand.
- type: entity
  abstract: true
  parent: BaseItem
  id: AU14DeployBoxBase
  name: supply box
  description: Packed for transport - use it in your hand to unpack what's inside.
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    state: box
  - type: AU14DeployBox
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: AU14DeployBoxBase
  id: AU14BoxChemDispenser
  name: chemical dispenser crate
  description: A chemical dispenser and its storage unit, packed for transport.
  components:
  - type: Item
    size: Large
  - type: AU14DeployBox
    anchor: true
    distance: 2
    entries:
    - prototype: RMCChemDispenserGround
    - prototype: RMCChemStorageGround
      offset: 1,0

- type: entity
  parent: AU14DeployBoxBase
