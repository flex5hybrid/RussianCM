# Грядки
- type: constructionGraph
  id: AU14CustomGraph_hydroponicsSoil__RuMC__FarmingRuMC
  start: start
  graph:
  - node: start
    edges:
    - to: mid
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSandbagFull
        amount: 5
        doAfter: 5
  - node: mid
    entity: AU14CustomEntityMid_hydroponicsSoil__RuMC__FarmingRuMC
    edges:
    - to: target
      steps:
      - entityId: AU14CustomEntity_AU14ToolShovel__RuMC__ToolsRuMC
        consume: false
        doAfter: 5
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSandbagFull
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2
  - node: target
    entity: AU14CustomEntity_hydroponicsSoil__RuMC__FarmingRuMC
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSandbagFull
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

- type: entity
  id: AU14CustomEntity_hydroponicsSoil__RuMC__FarmingRuMC
  parent: hydroponicsSoil
  suffix: AU14 Custom Construction
  components:
  - type: Construction
    graph: AU14CustomGraph_hydroponicsSoil__RuMC__FarmingRuMC
    node: target
  - type: StructuralSupport
    cantileverSpan: 2

- type: entity
  id: AU14CustomEntityMid_hydroponicsSoil__RuMC__FarmingRuMC
  parent: AU14CustomConstructionFrame
  suffix: AU14 Custom Construction (in progress)
  components:
  - type: Construction
    graph: AU14CustomGraph_hydroponicsSoil__RuMC__FarmingRuMC
    node: mid

- type: construction
  id: AU14Custom_hydroponicsSoil__RuMC__FarmingRuMC
  name: "soil"
  description: "A mix of organic matter and minerals creating a soil to grow your plant in space. Seems to be dry."
  graph: AU14CustomGraph_hydroponicsSoil__RuMC__FarmingRuMC
  startNode: start
  targetNode: target
  category: construction-category-rumc-farming
  spawnlist: RuMC
  isCM: true
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

