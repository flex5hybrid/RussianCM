# Клиппер
- type: constructionGraph
  id: AU14CustomGraphHydroponicsToolClippersRuMC
  start: start
  graph:
  - node: start
    edges:
    - to: target
      steps:
      - material: CMSteel
        amount: 3
        doAfter: 5
  - node: target
    entity: AU14CustomEntityHydroponicsToolClippersRuMC

- type: entity
  id: AU14CustomEntityHydroponicsToolClippersRuMC
  parent: HydroponicsToolClippers
  suffix: AU14 Custom Construction
  components:
  - type: Construction
    graph: AU14CustomGraphHydroponicsToolClippersRuMC
    node: target

- type: construction
  id: AU14CustomHydroponicsToolClippersRuMC
  name: "plant clippers"
  description: "A tool used to take samples from plants."
  graph: AU14CustomGraphHydroponicsToolClippersRuMC
  startNode: start
  targetNode: target
  category: construction-category-rumc-farming
  spawnlist: RuMC
  isCM: true
  objectType: Item

# Грядки
- type: constructionGraph
  id: AU14CustomGraphhydroponicsSoilRuMC
  start: start
  graph:
  - node: start
    edges:
    - to: mid
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSandbagFull
        amount: 5
        doAfter: 5
  - node: mid
    entity: AU14CustomEntityMidhydroponicsSoilRuMC
    edges:
    - to: target
      steps:
      - entityId: AU14ToolShovel
        consume: false
        doAfter: 5
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSandbagFull
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2
  - node: target
    entity: AU14CustomEntityhydroponicsSoilRuMC
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSandbagFull
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

- type: entity
  id: AU14CustomEntityhydroponicsSoilRuMC
  parent: hydroponicsSoil
  suffix: AU14 Custom Construction
  components:
  - type: Construction
    graph: AU14CustomGraphhydroponicsSoilRuMC
    node: target
  - type: StructuralSupport
    cantileverSpan: 2

- type: entity
  id: AU14CustomEntityMidhydroponicsSoilRuMC
  parent: AU14CustomConstructionFrame
  suffix: AU14 Custom Construction (in progress)
  components:
  - type: Construction
    graph: AU14CustomGraphhydroponicsSoilRuMC
    node: mid

- type: construction
  id: AU14CustomhydroponicsSoilRuMC
  name: "soil"
  description: "A mix of organic matter and minerals creating a soil to grow your plant in space. Seems to be dry."
  graph: AU14CustomGraphhydroponicsSoilRuMC
  startNode: start
  targetNode: target
  category: construction-category-rumc-farming
  spawnlist: RuMC
  isCM: true
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

