        doAfter: 5
      - entityId: CMAPCElectronics
        consume: true
        doAfter: 0
      - entityId: RMCPowerCellHigh
        consume: true
        doAfter: 5
      - entityId: RMCPowerCellHigh
        consume: true
        doAfter: 0
      - entityId: RMCPowerCellHigh
        consume: true
        doAfter: 0
      - tool: Welding
        doAfter: 5
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 30
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2
  - node: target
    entity: AU14CustomEntity_RMCSyntheticMaintenanceStation__RuMC__EngineeringRuMC
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 30
      - !type:SpawnPrototype
        prototype: RMCCableCoil1
