      falloff: 9999
      ignoreModifiers: true
    - range: 6
      falloff: 6
  - type: CMArmorPiercing
    amount: 10
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 6
      falloff: 6

