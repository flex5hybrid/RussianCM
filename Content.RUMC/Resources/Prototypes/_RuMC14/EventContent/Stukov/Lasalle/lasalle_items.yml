- type: entity
  parent: [CMBaseMask, CMUBaseGasMaskFilterSlot]
  id: RuMCGasmaskLB
  name: LBN-4 gas mask
  description: Lightweight high-durability gas mask developed by Lasalle Bionational for use in hazardous conditions during security and industrial tasks.
  components:
  - type: Sprite
    sprite: _RuMC14/EventContent/Stukov/lasalle/gasmask.rsi
  - type: Clothing
    sprite: _RuMC14/EventContent/Stukov/lasalle/gasmask.rsi
  - type: HideLayerClothing
    slots:
    - HeadTop
    - HeadSide
    - Snout
  - type: Tag
    tags:
    - GasMask
  - type: CMArmor
    bio: 20
  - type: MycotoxinProtection
    fullProtection: false

- type: radioChannel
  id: radioLB
  name: chat-radio-command
  keycode: "b"
  frequency: 4398
  color: "#3e5f8a"
  longRange: true
  tower: false

- type: entity
  parent: CMEncryptionKey
  id: RUMC14EncryptionKeyLB
  name: LB encryption key
  components:
