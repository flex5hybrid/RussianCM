# Unit Marshal

- type: job
  parent: CMJobBase
  id: RUMC14SWATTeamLeader
  name: Unit Marshal
  description: You are the unit marshal of the SWAT rapid response team. Confirm your assignment and directives with the responsible administrator or the responder who called you.
  playTimeTracker: RUMC14SWATTeamLeader
  ranks:
    RMCRankCivilian: []
  chevrons:
    Marshal:
      entity: AU14ChevronCMBMarshal
      requirements: []
  startingGear: RUMJobC14SWATLeader
  icon: "RMCJobIconBureauMarshal"
  joinNotifyCrew: false
  accessGroups:
  - auadmin
  - Colonist
  - CMCargoTech
  - auorbitalmanagement
  - aucmb
  - AUPrisonStaff
  - ShipMasterAccess
  - aulegacygroupcommand
  - AU14GovforCommand
  - AU14OpforCommand
  - auheadsofcolony
  spawnMenuRoleName: SWAT Unit Marshal
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - AUBureau
    - type: Language
      spokenLanguages:
      - English
      - TacticalSignLanguage
      understoodLanguages:
      - English
      - TacticalSignLanguage
      currentLanguage: English
      defaultLanguage: English
    - type: Skills
      skills:
        RMCSkillCqc: 3
        RMCSkillFirearms: 2
        RMCSkillPolice: 2
        RMCSkillFireman: 5
        RMCSkillConstruction: 2
        RMCSkillEngineer: 2
        RMCSkillEndurance: 3
        RMCSkillJtac: 3
        RMCSkillLeadership: 4
        RMCSkillVehicles: 1
        RMCSkillMedical: 2
        RMCSkillMeleeWeapons: 1
        RMCSkillOverwatch: 1
    - type: MarineOrders
      moveOrderSoundMale:
        collection: AU14MaleMoveOrder
      moveOrderSoundFemale:
        collection: AU14FemaleMoveOrder
      focusOrderSoundMale:
        collection: AU14MaleFocusOrder
      focusOrderSoundFemale:
        collection: AU14FemaleFocusOrder
      holdOrderSoundMale:
        collection: AU14MaleHoldOrder
      holdOrderSoundFemale:
        collection: AU14FemaleHoldOrder
    - type: SquadLeader
      icon:
        sprite: _RMC14/Interface/cm_job_icons.rsi
        state: cmb_mar
    - type: RMCPointing
    - type: RMCTrackable
    - type: JobPrefix
      prefix: MAR
  hidden: false

- type: entity
  id: RUMC14RandomHumanoidSWATLeader
  name: SWAT Marshal Commander ghost role
  suffix: Spawner, Player
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/cmb_marshal.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: RUMC14GhostSWATLeader

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: RUMC14GhostSWATLeader
  components:
  - type: GhostRole
    name: SWAT Unit Marshal
    description: You are the unit marshal of the SWAT rapid response team. Confirm your assignment and directives with the responsible administrator or the responder who called you.
    rules: Listen to your superiors. Strictly follow orders. Listen to the project administrator.
    reregister: false
    job: RUMC14SWATTeamLeader
    raffle:
      settings: short
  - type: GhostRoleApplySpecial
    squad: SquadSWATCMB

- type: startingGear
  id: RUMJobC14SWATLeader
  equipment:
    id: RUMC14IDCardSWATTeamLeader
    jumpsuit: AU14SWATFatiguesBasic
    outerClothing: RMCArmorM4RMarshallMedium
    gloves: AU14PVEHandsInsulatedBlackMarine
    head: RMCHeadBeretAgentIvan
    shoes: RMCBootsPMCFilled
    mask: Cigar
    ears: AU14CMBHeadsetOnlyCMB
    back: AU14MolleSatchel
    belt: RMCM276ShotgunShellLoadingRigFill
    pocket1: RMCPouchMedicalSocDutchUnmarked
    pocket2: AU14PouchPoliceEquipmentSupportSynth
    suitstorage: RMCWeaponShotgunM3717
    eyes: CMGlassesSecurity
  storage:
    back:
    - RMCLaserDesignator
    - RMCExplosiveBreachingChargeRubber
    - CMFireExtinguisherPortable
    - RMCTacticalPrybar
    - AU14AttachmentTwoPointSling
    outerClothing:
    - CMMRE
    - CMMRE
    pocket1:
    - CMHealthAnalyzer
    - CMUpgradedTraumaKit10
    - CMUpgradedTraumaKit10
    - CMUpgradedBurnKit10
    - CMUpgradedBurnKit10
    - CMBicaridineAutoInjector
    - CMKelotaneAutoInjector
    - CMTricordrazineAutoInjectorNoSkill
    - AU14OxycodoneAutoInjector
    - CMDexalinPlusAutoInjector
  inhand:
