- type: entity
  parent: RMCSmartGunNoCamo
  id: RuMCSmartGunWeYaCommando
  name: the smartgun M56T 'Terminator'
  description: This is a real firearm of the M56T Smartgun system, which consists of four parts. If you have it, you are ready to cause serious pain to anyone who gets in your way.
  suffix: Commando
  components:
  - type: Sprite
    sprite: _RuMC14/EventContent/Stukov/weya/smart_gun.rsi
    layers:
    - state: base
      sprite: _RuMC14/EventContent/Stukov/weya/smart_gun.rsi
    - state: mag-0
      sprite: _RuMC14/EventContent/Stukov/weya/smart_gun.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/EventContent/Stukov/weya/smart_gun.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineSmartGunirradiated
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_sg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSmartGunirradiated
          - RMCMagazineSmartGun #For some reason when this is removed mags literally becomes unusable :confused:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: RMCPowerCellSmartgun
        whitelist:
          components:
          - SmartGunBattery
  - type: GunDamageModifier
    multiplier: 1
  - type: GunToggleableAmmo
    settings:
    - damage:
        types:
          Piercing: 40
      armorPiercing: 5
      name: rmc-toggleable-ammo-highly-precise
      icon:
        sprite: _RMC14/Actions/marine_smart_gun_actions.rsi
        state: ammo_swap_normal
    - damage:
        types:
          Piercing: 30
      armorPiercing: 35
      name: rmc-toggleable-ammo-armor-shredding
      icon:
        sprite: _RMC14/Actions/marine_smart_gun_actions.rsi
        state: ammo_swap_ap
  - type: RMCSelectiveFire
    recoilWielded: 0
    scatterWielded: 10
    baseFireRate: 7.6
    burstScatterMult: 1
    modifiers:
      FullAuto:
        maxScatterModifier: 0
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 80
  - type: GunIDLock

