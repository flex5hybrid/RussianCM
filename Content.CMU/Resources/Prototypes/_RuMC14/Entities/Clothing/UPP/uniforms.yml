- type: entity
  parent: [RMCMarineUniformBase, RMCAlternateFoldableUniformBase]
  id: RuMCUPPFatiguesCrew
  name: UPP crew fatigues
  description: Standard-issue fatigues for UPP vehicle crews. Reinforced seams and flame-resistant fabric designed for tankers and drivers. Practical and durable for life inside an armored vehicle.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/uniform/crew.rsi
  - type: UniformAccessoryHolder
    startingAccessories:
    - AU14PatchUPP

- type: entity
