# Православный крест
- type: entity
  parent: RMCHelmetGarbBase
  id: RuMCUPPHelmetGarbOrthodoxCross
  name: orthodox cross helmet garb
  description: A small orthodox cross attached to a helmet. A symbol of faith for those who believe in something greater than the Union.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/HelmetGarb/orthodox_cross.rsi
    state: icon
  - type: Item
    sprite: _RuMC14/Clothing/UPP/HelmetGarb/orthodox_cross.rsi
  - type: HelmetAccessory
    rsi:
      sprite: _RuMC14/Clothing/UPP/HelmetGarb/orthodox_cross.rsi
      state: helmet

