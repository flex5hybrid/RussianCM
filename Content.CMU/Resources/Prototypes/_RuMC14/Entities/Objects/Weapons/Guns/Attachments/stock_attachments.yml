- type: entity
  parent: RMCAttachmentM54CStockCollapsible
  id: RuMCAttachmentAK7074StockCollapsible
  name: AK7074 folding stock
  description: The standard back end of any gun starting with AK7074.
  components:
  - type: AttachableVisuals
    suffix: ""
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Attachments/Stock/rumc_NewK_stock.rsi
    state: stock_AK7074
  - type: AttachableToggleable
    active: true
    doAfterBreakOnMove: false
    doAfter: 0.5
    icon:
      sprite: _RuMC14/Objects/Weapons/Guns/Attachments/Stock/rumc_NewK_stock.rsi
      state: stock_AK7074
    iconActive:
      sprite: _RuMC14/Objects/Weapons/Guns/Attachments/Stock/rumc_NewK_stock.rsi
      state: stock_AK7074-on
    actionName: Toggle AK7074 Folding Stock
  - type: Tag
    tags:
    - RMCAttachmentStock
    - RuMCAttachmentAK7074StockCollapsible

