    recoilWielded: 3
    scatterWielded: 10
    baseFireRate: 10
    burstScatterMult: 1
    modifiers:
      FullAuto:
        maxScatterModifier: 0
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 80
