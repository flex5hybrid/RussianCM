- type: entity
  parent: [ ClothingEyesBase , ShowMedicalIcons ]
  id: RuCMGlassesM4WeYa
  suffix: Corporate Commando
  name: M4 night vision device
  description: Headset and night vision system. Allows for an illuminated view of the surrounding environment.
  components:
  - type: Item
    storedRotation: 0
  - type: Sprite
    sprite: _RuMC14/WeYu/night_vision_goggles.rsi
    layers:
    - state: icon
    map: [ "icon" ]
  - type: Clothing
    sprite: _RuMC14/WeYu/night_vision_goggles.rsi
  - type: NightVisionItem
    mesons: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NightVisionItemVisuals.Active:
        icon:
          True: { state: icon_on }
          False: { state: icon }

