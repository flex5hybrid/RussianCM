- type: entity
  parent: ArmorHelmetM10
  id: RuCMArmorHelmetPMCCommandoWeYa
  suffix: Corporate Commando
  name: Elite PMC helmet MY7
  description: A fully enclosed armored helmet designed for use with the MY7 system.
  components:
  - type: Sprite
    sprite: _RuMC14/WeYu/helmet_rifleman.rsi
  - type: Clothing
    sprite: _RuMC14/WeYu/helmet_rifleman.rsi
  - type: Corrodible
    isCorrodible: false
  - type: RMCEarProtection
  - type: CMArmor
    melee: 30
    bullet: 40
    bio: 30
    explosionArmor: 40
  - type: IntegratedVisors
    visorsToAdd:
    - RMCVisorSquadIntegrated
    - RMCVisorMedicalAdvancedIntegrated
  - type: ItemCamouflage
    camouflageVariations: { }

- type: entity
