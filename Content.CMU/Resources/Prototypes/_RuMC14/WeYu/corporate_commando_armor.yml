# Armor and helmet prototypes
- type: entity
  parent: RMCArmorM4PMCNoLight
  id: RuCMArmorM4PMCCommandoWeYa
  suffix: Corporate Commando
  name: Elite Armor MY7
  description: A complex system of overlapping plates, designed to make the wearer highly resistant to fire from small arms.
  components:
  - type: Sprite
    sprite: _RuMC14/WeYu/armor_rifleman.rsi
  - type: CMArmor
    melee: 30 # CLOTHING_ARMOR_VERYHIGH (melee);
    bullet: 40 # CLOTHING_ARMOR_ULTRAHIGH (bullets); going with an intermediate value until more damage types get implemented (more likely to be hit by bullets than melee)
    bio: 25 # CLOTHING_ARMOR_MEDIUM
    explosionArmor: 35 # CLOTHING_ARMOR_VERYHIGH
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_MEDIUM
    walkModifier: 0.727
    sprintModifier: 0.727
  - type: Storage
    grid:
    - 0,0,7,1 # 4 slots
  - type: Corrodible
    isCorrodible: false

