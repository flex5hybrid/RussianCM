# Маршал подразделения

- type: job
  parent: CMJobBase
  id: RuCMSWATTeamLeader
  name: SWAT Unit Marshal
  description: You are the SWAT rapid response unit marshal. Confirm your assignment and directives with the administrator or responder who called you in.
  playTimeTracker: RuCMSWATTeamLeader
  ranks:
    RMCRankCivilian: []
  chevrons:
    Marshal:
      entity: AU14ChevronCMBMarshal
      requirements: []
  startingGear: RuCMRUMJobC14SWATLeader
  icon: "RMCJobIconBureauMarshal"
  joinNotifyCrew: false
  accessGroups:
  - auadmin
  - Colonist
  - CMCargoTech
  - auorbitalmanagement
  - aucmb
  - AUPrisonStaff
  - ShipMasterAccess
  - aulegacygroupcommand
  - AU14GovforCommand
  - AU14OpforCommand
  - auheadsofcolony
  spawnMenuRoleName: SWAT Unit Marshal
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - AUBureau
    - type: Language
      spokenLanguages:
      - English
      - TacticalSignLanguage
      understoodLanguages:
      - English
      - TacticalSignLanguage
      currentLanguage: English
      defaultLanguage: English
    - type: Skills
      skills:
        RMCSkillCqc: 3
        RMCSkillFirearms: 2
        RMCSkillPolice: 2
        RMCSkillFireman: 5
        RMCSkillConstruction: 2
        RMCSkillEngineer: 2
        RMCSkillEndurance: 3
        RMCSkillJtac: 3
        RMCSkillLeadership: 4
        RMCSkillVehicles: 1
        RMCSkillMedical: 2
        RMCSkillMeleeWeapons: 1
        RMCSkillOverwatch: 1
    - type: MarineOrders
      moveOrderSoundMale:
        collection: AU14MaleMoveOrder
      moveOrderSoundFemale:
        collection: AU14FemaleMoveOrder
      focusOrderSoundMale:
        collection: AU14MaleFocusOrder
      focusOrderSoundFemale:
        collection: AU14FemaleFocusOrder
      holdOrderSoundMale:
        collection: AU14MaleHoldOrder
      holdOrderSoundFemale:
        collection: AU14FemaleHoldOrder
    - type: SquadLeader
      icon:
        sprite: _RMC14/Interface/cm_job_icons.rsi
        state: cmb_mar
    - type: RMCPointing
    - type: RMCTrackable
    - type: JobPrefix
      prefix: MAR
  hidden: false

- type: entity
  id: RuCMRandomHumanoidSWATLeader
  name: SWAT Marshal Commander ghost role
  suffix: Spawner, Player, CMB SWAT, RuCM
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/cmb_marshal.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: RuCMGhostSWATLeader

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: RuCMGhostSWATLeader
  components:
  - type: GhostRole
    name: SWAT Unit Marshal
    description: Follow your commander’s orders and complete the assigned SWAT mission.
    rules: Follow your chain of command and obey all orders. Follow the event administrator’s instructions.
    reregister: false
    job: RuCMSWATTeamLeader
    raffle:
      settings: short
  - type: GhostRoleApplySpecial
    squad: RuCMSquadSWATCMB

- type: startingGear
  id: RuCMRUMJobC14SWATLeader
  equipment:
    id: RuCMIDCardSWATTeamLeader
    jumpsuit: RuCMSWATFatiguesBasic
    outerClothing: RMCArmorM4RMarshallMedium
    gloves: AU14PVEHandsInsulatedBlackMarine
    head: RMCHeadBeretAgentIvan
    shoes: RMCBootsPMCFilled
    mask: Cigar
    ears: AU14CMBHeadsetOnlyCMB
    back: AU14MolleSatchel
    belt: RMCM276ShotgunShellLoadingRigFill
    pocket1: RMCPouchMedicalSocDutchUnmarked
    pocket2: AU14PouchPoliceEquipmentSupportSynth
    suitstorage: RMCWeaponShotgunM3717
    eyes: CMGlassesSecurity
  storage:
    back:
    - RMCLaserDesignator
    - RMCExplosiveBreachingChargeRubber
    - CMFireExtinguisherPortable
    - RMCTacticalPrybar
    - AU14AttachmentTwoPointSling
    outerClothing:
    - CMMRE
    - CMMRE
    pocket1:
    - CMHealthAnalyzer
    - CMUpgradedTraumaKit10
    - CMUpgradedTraumaKit10
    - CMUpgradedBurnKit10
    - CMUpgradedBurnKit10
    - CMBicaridineAutoInjector
    - CMKelotaneAutoInjector
    - CMTricordrazineAutoInjectorNoSkill
    - AU14OxycodoneAutoInjector
    - CMDexalinPlusAutoInjector
  inhand:
    - RMCZippoGold

- type: playTimeTracker
  id: RuCMSWATTeamLeader

