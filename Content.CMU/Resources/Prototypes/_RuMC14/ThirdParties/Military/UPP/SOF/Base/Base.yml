#  Headset

- type: entity
  parent: RMCHeadsetMarine
  id: RuMCHeadsetSOF
  name: UPP SOF headset
  description: Issued exclusively to UPP Special Forces such as SOF.
  suffix: RuMC, SOF
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/headsets.rsi
    state: soc_headset
  - type: ContainerFill
    containers:
      key_slots:
      - CMEncryptionKeyColony
      - AU14EncryptionKeyUPPAmb
  - type: RMCHeadset
    channels:
    - UPPSOF
  - type: GrantSquadLeaderTracker
    defaultMode: SquadLeader
    trackerModes:
    - SOFsCommandingOfficer
    - SquadLeader
    - BattleBuddy
    - PrimaryLandingZone

