        role: RuMCJobUPPSOFMachinegunner
        time: 7200 # 2 hours
    UPP_Lieutenant:
      entity: AU14ChevronUPPNILieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPSOFMachinegunner
        time: 10800 # 3 hours
  spawnMenuRoleName: SOF Machinegunner
  startingGear: RuMCGearUPPSOFbase_HEAVY
