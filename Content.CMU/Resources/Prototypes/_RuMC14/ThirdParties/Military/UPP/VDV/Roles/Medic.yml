- type: job
  parent: CMJobBase
  id: RuMCUPPVDVMedic
  roundSide: ThirdParty
  roundForce: UPP
  roundRole: RuMCUPPVDVMedic
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: spp_sl_a
  - type: AssignSquad
    whitelist:
      tags:
      - RuMCSquadVDV
  - type: Skills
    skills:
      RMCSkillCqc: 2
      RMCSkillEngineer: 1
      RMCSkillConstruction: 1
      RMCSkillFirearms: 1
      RMCSkillMedical: 3
      RMCSkillSurgery: 3
      RMCSkillMeleeWeapons: 2
      RMCSkillPolice: 1
      RMCSkillFireman: 1
      RMCSkillEndurance: 2
  - type: EquipEntityPreset
    preset: RuMCVDVMedicPreset
  - type: JobPrefix
    prefix: rumc-job-prefix-vdv
  - type: MarineOrders
  - type: RMCTrackable
  - type: RMCPointing
  - type: Language
    spokenLanguages:
    - English
    - Russian
    - German
    understoodLanguages:
    - English
    - Russian
    - Spanish
    - German
    currentLanguage: Russian
    defaultLanguage: Russian

  name: Medic
  description: VDV Medic
  playTimeTracker: RuMCJobUPPVDVMedic
  ranks:
    RMCRankCivilian: []
  chevrons:
    UPP_Plutonowy:
      entity: AU14ChevronUPPNIPlutonowy
      requirements: []
    UPP_Sergeant:
      entity: AU14ChevronUPPNISergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVMedic
        time: 1800 # 0.5 hours
    UPP_SeniorSergeant:
      entity: AU14ChevronUPPNISeniorSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVMedic
        time: 5400 # 1.5 hours
    UPP_JuniorLieutenant:
      entity: AU14ChevronUPPNIJuniorLieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVMedic
        time: 7200 # 2 hours
    UPP_Lieutenant:
      entity: AU14ChevronUPPNILieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVMedic
        time: 10800 # 3 hours
  spawnMenuRoleName: VDV Medic
  startingGear: RuMCGearUPPVDVMedic
  greeting: rumc-vdv-greeting
  icon: "RuMCJobIconUPPVDVMedic"
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-govfor
  accessGroups:
  - AU14GovforSquad
  hidden: false

- type: entity
  parent: RuMCBaseMobSpeciesOrganicUPPVDV
  id: RuMCJobUPPVDVMedic
  name: VDV Medic
  components:
  - type: EquipEntityPreset
    preset: RuMCVDVMedicPreset
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: RuMCSquadVDV
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: VDV Medic
    description: You are part of a UPP! Not one step back!
    job: RuMCUPPVDVMedic
    raffle:
      settings: short

- type: startingGear
  parent: RuMCGearUPPVDVbaseLigth
  id: RuMCGearUPPVDVMedic
  equipment:
    id: RuCMIDCardUPPVDVMedic
    ears: RuMCHeadsetVDV
  storage:
    back:
    - RuMCirpUPP
    - AU14GrenadeSmokeUPP
    - AU14CMDefibrillator
    - CMSurgicalCaseFilled
    - CMPortableSurgicalBedSpawnFolded
    - ClothingHandsGlovesNitrile
  inhand:
    - RuMCirpUPP

- type: jobIcon
  parent: CMJobIconBase
  id: RuMCJobIconUPPVDVMedic
  icon:
    sprite: _RuMC14/Interface/upp_icons.rsi
    state: UPP-VDV_med

# Time tracker

- type: playTimeTracker
  id: RuMCJobUPPVDVMedic
