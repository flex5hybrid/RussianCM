- type: job
  parent: CMJobBase
  id: RuMCUPPVDVRifleman
  roundSide: ThirdParty
  roundForce: UPP
  roundRole: RuMCUPPVDVRifleman
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: spp_sl_a
  - type: AssignSquad
    whitelist:
      tags:
      - RuMCSquadVDV
  - type: Skills
    skills:
      RMCSkillCqc: 2
      RMCSkillEngineer: 1
      RMCSkillConstruction: 1
      RMCSkillFirearms: 1
      RMCSkillMedical: 1
      RMCSkillMeleeWeapons: 2
      RMCSkillPolice: 1
      RMCSkillFireman: 1
      RMCSkillVehicles: 2
      RMCSkillEndurance: 2
  - type: EquipEntityPreset
    preset: RuMCVDVPreset
  - type: JobPrefix
    prefix: rumc-job-prefix-vdv
  - type: MarineOrders
  - type: RMCTrackable
  - type: RMCPointing
  - type: Language
    spokenLanguages:
    - English
    - Russian
    - German
    understoodLanguages:
    - English
    - Russian
    - German
    currentLanguage: Russian
    defaultLanguage: Russian

  name: Rifleman
  description: VDV Rifleman
  playTimeTracker: RuMCJobUPPVDVRifleman
  ranks:
    RMCRankCivilian: []
  chevrons:
    UPP_Plutonowy:
      entity: AU14ChevronUPPNIPlutonowy
      requirements: []
    UPP_Sergeant:
      entity: AU14ChevronUPPNISergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVRifleman
        time: 1800 # 0.5 hours
    UPP_SeniorSergeant:
      entity: AU14ChevronUPPNISeniorSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVRifleman
        time: 5400 # 1.5 hours
    UPP_JuniorLieutenant:
      entity: AU14ChevronUPPNIJuniorLieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVRifleman
        time: 7200 # 2 hours
    UPP_Lieutenant:
      entity: AU14ChevronUPPNILieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVRifleman
        time: 10800 # 3 hours
  spawnMenuRoleName: VDV Rifleman
  startingGear: RuMCGearUPPVDVRifleman
  greeting: rumc-vdv-greeting
  icon: "RuMCJobIconUPPVDVRifleman"
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-govfor
  accessGroups:
  - AU14GovforSquad
  hidden: false

- type: entity
  parent: RuMCBaseMobSpeciesOrganicUPPVDV
  id: RuMCJobUPPVDVRifleman
  name: VDV Rifleman
  components:
  - type: EquipEntityPreset
    preset: RuMCVDVPreset
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: RuMCSquadVDV
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: VDV Rifleman
    description: You are part of a UPP! Not one step back!
    job: RuMCUPPVDVRifleman
    raffle:
      settings: short

- type: startingGear
  parent: RuMCGearUPPVDVbase
  id: RuMCGearUPPVDVRifleman
  equipment:
    id: RuCMIDCardUPPVDVRifleman
    ears: RuMCHeadsetVDV
    suitstorage: RuMCWeaponRifleAK7074
  storage:
    back:
    - RuMCirpUPP
    - AU14GrenadeHighExplosiveUPP
    - AU14GrenadeSmokeUPP
    - AU14GrenadeHighExplosiveUPP
  inhand:
    - RuMCirpUPP

- type: jobIcon
  parent: CMJobIconBase
  id: RuMCJobIconUPPVDVRifleman
  icon:
    sprite: _RuMC14/Interface/upp_icons.rsi
    state: UPP-VDV_inf

# Time tracker

- type: playTimeTracker
  id: RuMCJobUPPVDVRifleman
