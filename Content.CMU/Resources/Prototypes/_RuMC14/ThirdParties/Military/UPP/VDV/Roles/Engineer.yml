- type: job
  parent: CMJobBase
  id: RuMCUPPVDVEngineer
  roundSide: ThirdParty
  roundForce: UPP
  roundRole: RuMCUPPVDVEngineer
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: spp_sl_a
  - type: AssignSquad
    whitelist:
      tags:
      - RuMCSquadVDV
  - type: Skills
    skills:
      RMCSkillCqc: 2
      RMCSkillEngineer: 4
      RMCSkillConstruction: 3
      RMCSkillFirearms: 3
      RMCSkillMeleeWeapons: 2
      RMCSkillMedical: 1
      RMCSkillPolice: 1
      RMCSkillFireman: 3
      RMCSkillVehicles: 3
      RMCSkillJtac: 1
  - type: EquipEntityPreset
    preset: RuMCVDVEngineerPreset
  - type: JobPrefix
    prefix: rumc-job-prefix-vdv
  - type: MarineOrders
  - type: RMCTrackable
  - type: RMCPointing
  - type: Language
    spokenLanguages:
    - English
    - Russian
    - Spanish
    - German
    understoodLanguages:
    - Polish
    - English
    - Russian
    - Spanish
    - Mandarin
    - German
    currentLanguage: Russian
    defaultLanguage: Russian

  name: Engineer
  description: VDV Engineer
  playTimeTracker: RuMCJobUPPVDVEngineer
  ranks:
    RMCRankCivilian: []
  chevrons:
    UPP_Plutonowy:
      entity: AU14ChevronUPPNIPlutonowy
      requirements: []
    UPP_Sergeant:
      entity: AU14ChevronUPPNISergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVEngineer
        time: 1800 # 0.5 hours
    UPP_SeniorSergeant:
      entity: AU14ChevronUPPNISeniorSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVEngineer
        time: 5400 # 1.5 hours
    UPP_JuniorLieutenant:
      entity: AU14ChevronUPPNIJuniorLieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVEngineer
        time: 7200 # 2 hours
    UPP_Lieutenant:
      entity: AU14ChevronUPPNILieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPVDVEngineer
        time: 10800 # 3 hours
  spawnMenuRoleName: VDV Engineer
  startingGear: RuMCGearUPPVDVEngineer
  greeting: rumc-vdv-greeting
  icon: "RuMCJobIconUPPVDVEngineer"
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-govfor
  accessGroups:
  - AU14GovforSquad
  hidden: false

- type: entity
  parent: RuMCBaseMobSpeciesOrganicUPPVDV
  id: RuMCJobUPPVDVEngineer
  name: VDV Engineer
  components:
  - type: EquipEntityPreset
    preset: RuMCVDVEngineerPreset
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: RuMCSquadVDV
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: VDV Engineer
    description: You are part of a UPP! Not one step back!
    job: RuMCUPPVDVEngineer
    raffle:
      settings: short

- type: startingGear
  parent: RuMCGearUPPVDVbase
  id: RuMCGearUPPVDVEngineer
  equipment:
    id: RuCMIDCardUPPVDVEngineer
    ears: RuMCHeadsetVDV
    suitstorage: RuMCWeaponRifleAK7074
  storage:
    back:
    - RuMCirpUPP
    - CMSheetMetal
    - CMSheetMetal
    - CMSheetPlasteel50
    - AU14GrenadeHighExplosiveUPP
    - RMCExplosiveBreachingCharge
  inhand:
    - RuMCUTESCCase_GROZA

- type: jobIcon
  parent: CMJobIconBase
  id: RuMCJobIconUPPVDVEngineer
  icon:
    sprite: _RuMC14/Interface/upp_icons.rsi
    state: UPP-VDV_eng

# Time tracker

- type: playTimeTracker
  id: RuMCJobUPPVDVEngineer
