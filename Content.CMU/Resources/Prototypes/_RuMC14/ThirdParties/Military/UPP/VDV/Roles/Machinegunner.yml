    preset: RuMCVDVMachinegunnerPreset
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: RuMCSquadVDV
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: VDV Machinegunner
    description: You are part of a UPP! Not one step back!
    job: RuMCUPPVDVMachinegunner
    raffle:
      settings: short

