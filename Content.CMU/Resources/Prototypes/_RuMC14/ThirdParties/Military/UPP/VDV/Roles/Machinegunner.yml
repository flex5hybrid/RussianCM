    - RuMCirpUPP
    - AU14GrenadeHighExplosiveUPP
    - AU14GrenadeSmokeUPP
    - RMCExplosiveBreachingCharge
  inhand:
    - RuMCirpUPP

- type: jobIcon
  parent: CMJobIconBase
  id: RuMCJobIconUPPVDVMachinegunner
  icon:
