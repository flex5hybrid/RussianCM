  roundForce: UPP
  roundRole: RuMCUPPVDVMachinegunner
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: spp_sl_a
  - type: AssignSquad
    whitelist:
      tags:
      - RuMCSquadVDV
  - type: Skills
    skills:
      RMCSkillCqc: 3
      RMCSkillEngineer: 1
      RMCSkillConstruction: 1
      RMCSkillFirearms: 2
      RMCSkillMeleeWeapons: 3
      RMCSkillMedical: 1
      RMCSkillFireman: 1
      RMCSkillJtac: 1
  - type: EquipEntityPreset
    preset: RuMCVDVMachinegunnerPreset
