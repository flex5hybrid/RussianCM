- type: entity
  parent: CMMagazineRifleBase
  id: RuCMMagazineSMGM36
  suffix: Lasalle HIG
  name: A-M36 Power Cell
  description: A high-capacity disposable power cell developed for the experimental A-M36.
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - RuCMMagazineSMGM36
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - RuCMCartridgeLaserSMG
    proto: RuCMCartridgeLaserSMG
    capacity: 40
  - type: Sprite
    sprite: _RuMC14/Lasalle/magazine_m36.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance

- type: entity
  parent: CMBaseWeaponSMG
  name: Experimental A-M36
  id: RuCMWeaponSMGM36
  description: An experimental directed-energy submachine gun developed for Lasalle Bionational security forces. Issued to high-risk response teams and select elite operators, its powerful laser pulses can ignite organic targets.
  suffix: Filled, Lasalle HIG
  components:
  - type: Sprite
    sprite: _RuMC14/Lasalle/smg_m36.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/Lasalle/smg_m36.rsi
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m63.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 0.1
    recoilUnwielded: 5
    scatterWielded: 10
    scatterUnwielded: 15
    baseFireRate: 6.67
    burstScatterMult: 5
    modifiers:
      Burst:
        fireDelay: 0.0999
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
      FullAuto:
        maxScatterModifier: 2.75
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.8
  - type: MagazineAmmoProvider
    autoEject: true
    soundAutoEject: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RuCMMagazineSMGM36
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RuCMMagazineSMGM36
  - type: AttachableHolder
    randomAttachmentChance: 0.1
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
          - RMCM5Bayonet
      rmc-aslot-rail:
        startingAttachable: RMCAttachmentS5MicroRedDotSight
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        startingAttachable: RMCAttachmentLaserSight
        whitelist:
          tags:
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentBipod
          - RMCAttachmentExtinguisher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.74, 0.1
      rmc-aslot-rail: 0.002, 0.1
      rmc-aslot-underbarrel: 0.35, -0.321
  - type: GunDamageModifier
    multiplier: 1
    

