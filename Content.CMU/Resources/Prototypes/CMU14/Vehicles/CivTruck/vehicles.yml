- type: entity
  parent: VehicleVanBase
  id: AU14VehicleCivVan
  name: Civilian van
  description: An old military van. This one seems to be working for civilians
  components:
  - type: Damageable
    damageModifierSet: VehicleFrameCLFVan
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Sprite
    sprite: CMU14/Structures/vehicles/hybrisavehicles/van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleSound
    collisionSoundCooldown: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/CMU14/Vehicles/Interiors/van_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 10
    maxXenos: 2
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.25,0
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.25,-1
    - offset: 0,2
      radius: 0.75
      interiorCoords: 0.25,-1

- type: entity
  parent: VehicleVanBase
  id: AU14VehicleCivTruck
  name: Civilian truck
  description: An old military truck. This one seems to be working for civilians
  components:
  # CMU14 Tuning Begin: slots for civilian vehicle modules (wheel slot repeated from the base)
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-armor: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-front: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-engine: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
      cmu-turret: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: HardpointSlots
    vehicleFamily: Van
    slots:
    - id: wheel-1
      visualLayer: cmu-wheels
      disableEject: true
      hardpointType: Wheel
      slotType: Wheel
      insertDelay: 1.5
      whitelist:
        components:
        - VehicleWheelItem
    - id: cmu-armor
      visualLayer: cmu-armor
      disableEject: true
      hardpointType: Armor
      slotType: Armor
      required: false
      insertDelay: 3.0
    - id: cmu-front
      visualLayer: cmu-front
      disableEject: true
      hardpointType: FrontAttachment
      slotType: FrontAttachment
      required: false
      insertDelay: 3.0
    - id: cmu-engine
      disableEject: true
      hardpointType: SupportAttachment
      slotType: SupportAttachment
      required: false
      insertDelay: 3.0
    - id: cmu-turret
      disableEject: true
      hardpointType: Turret
      slotType: Turret
      required: false
      insertDelay: 3.0
  - type: VehicleHardpointVisuals
  - type: CMUVehicleTurretMount
    north: 0,34
    east: 20,21
    south: 0,-16
    west: -20,21
  # CMU14 Tuning End
  - type: Damageable
    damageModifierSet: VehicleFrameCLFVan
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Sprite
    sprite: CMU14/Structures/vehicles/hybrisavehicles/van.rsi
    layers:
    - map: [ base ]
      state: truck_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
    # CMU14 Tuning Begin: the fitted civilian vehicle modules, shown by VehicleHardpointVisuals
    - map: [ cmu-wheels ]
      sprite: CMU14/Structures/vehicles/tuning_civ_truck.rsi
      state: wheels_armoured
      visible: false
    - map: [ cmu-armor ]
      sprite: CMU14/Structures/vehicles/tuning_civ_truck.rsi
      state: armour
      visible: false
    - map: [ cmu-front ]
      sprite: CMU14/Structures/vehicles/tuning_civ_truck.rsi
      state: bullbar_spiked
      visible: false
    # CMU14 Tuning End
  - type: VehicleSound
    collisionSoundCooldown: 1.5
  - type: VehicleEnter
    interiorPath: /Maps/CMU14/Vehicles/Interiors/truck_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 4
    maxXenos: 1
    entryPoints:
    - offset: 0,0
      radius: 0.1
      interiorCoords: 3.5,-0.5
    - offset: -1,-0.25
      radius: 0.6
      interiorCoords: 3.5,-0.5
    - offset: -1,-0.25
      radius: 0.6
      interiorCoords: 3.5,-0.5

