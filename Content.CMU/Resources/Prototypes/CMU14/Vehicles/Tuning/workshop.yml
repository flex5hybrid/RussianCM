# The vehicle tuning workshop: a powered recipe machine that turns industry materials into vehicle modules.
# The recipe chosen in its window (or the circuit set there) picks what it makes. Its input slots take whole items as well as stacks
# (a module and a wheel for armoured wheels), and its tank takes welding fuel and heavy fuel, poured in from a container
# in the hand or piped in. Its sprite is the complex assembly bench's with a wheel plate on it.
- type: entity
  parent: [ RUMCRecipeMachineBase, RUMCFluidMachineBase, BaseMachinePowered, BaseMachineDestructible ]
  id: CMUMachineVehicleWorkshop
  name: vehicle tuning workshop
  description: Builds modules for civilian vehicles - armour, wheels, a bullbar, an engine, a turret and a mounted machine gun. Pick the recipe in its window. Welding fuel and heavy fuel go into its tank.
  components:
  - type: Sprite
    sprite: CMU14/Production/Electric/vehicle_workshop.rsi
    noRot: true
    layers:
    - state: off
      map: [ "off" ]
    - state: on
      map: [ "on" ]
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 60
  - type: PowerState
    idlePowerDraw: 60
    workingPowerDraw: 1500
  - type: ActivatableUIRequiresPower
  - type: RecipeMachine
    kind: cmuvehicleworkshop
    recipeSelection: true
    maxCircuit: 9
  - type: ItemSlots
    slots:
      input1: { whitelist: { components: [ Item ] }, insertOnInteract: false }
      input2: { whitelist: { components: [ Item ] }, insertOnInteract: false }
      input3: { whitelist: { components: [ Item ] }, insertOnInteract: false }
      input4: { whitelist: { components: [ Item ] }, insertOnInteract: false }
      output1: { insertOnInteract: false }
      output2: { insertOnInteract: false }
      output3: { insertOnInteract: false }
      output4: { insertOnInteract: false }
  - type: FluidTank
    capacity: 300

- type: craftRecipe
  id: CMUCraftBuildVehicleWorkshop
  name: cmu-craft-recipe-build-vehicle-workshop
  output: CMUMachineVehicleWorkshop
  outputCount: 1
  time: 20
  minigames: [Center, Hold, Trace]
  tools:
  - Hammering
  consumables:
  - stack: RUMCMachineHull
    amount: 1
  - stack: RUMCKitDrive
    amount: 3
  - stack: RUMCKitHydraulics
    amount: 5
  - stack: RUMCKitSimpleCircuits
    amount: 1
  - stack: RUMCKitWiring
    amount: 5

- type: cmuMachineRecipe
  id: CMUMRVehicleWorkshopArmorModule
  machine: cmuvehicleworkshop
  inputs:
    RUMCArmourPlates: 5
  itemOutputs:
    CMUVehicleArmorModuleCivilian: 1
  circuit: 1
  duration: 20

