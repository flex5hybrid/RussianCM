

# PMC armors
- type: entity
  parent: [RMCBaseMarineArmor, RMCAllowSuitStorageClothingArmorPMC]
  id: RuMCLBArmorN
  name: M3-LB Combat Armor
  description: A heavily modified, proprietary version of Armat Systems' M3 armor platform developed by Lasalle Bionational. Issued exclusively to operators of the corporation's Hazard Intervention Group for high-risk operations in hostile environments.
  components:
  - type: RMCArmorSpeedTier
    speedTier: medium
  - type: ExplosionResistance
    damageCoefficient: 0
    worn: false
  - type: Sprite
    sprite: /Textures/_RuMC14/ThirdParties/Corporate/Lasalle/armor.rsi
  - type: CMArmor
    melee: 20
    bullet: 25 # CLOTHING_ARMOR_MEDIUMHIGH
    bio: 20 # CLOTHING_ARMOR_MEDIUM
    explosionArmor: 20 # CLOTHING_ARMOR_MEDIUM
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: Storage
    grid:
    - 0,0,3,1 # 2 slots
  - type: ItemCamouflage
    camouflageVariations: { }

