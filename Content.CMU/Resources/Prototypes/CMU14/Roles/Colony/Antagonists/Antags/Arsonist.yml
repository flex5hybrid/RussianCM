- type: antagSpecifier
  id: Arsonist
  prefRoles: [ ArsonistRole ]
  jobBlacklistGroup:
  - RuMCNoColonialAntagsJobs # RuMC edit
  - AllGovforJobs
  - AllOpforJobs
  - AllCLFJobs
# - AllColonyDepartmentHeadJobs
  briefing:
    text: cmu-antag-arsonist-greeting
    color: DarkOrange
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  startingGear: CMUGearArsonist
  components:
  - type: Arsonist
    alertThreshold: 2
    wantedThreshold: 8
    bountyPerFire: 150
    maxBounty: 5750
  - type: SynthGunAccess
  mindRoles:
  - MindRoleArsonist

- type: entity
  id: Arsonist
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:RandomAntagCount
      proto: Arsonist
      range:
        min: 1
        max: 3

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleArsonist
  name: Arsonist Mind Role
  components:
  - type: MindRole
    antagPrototype: ArsonistRole
    exclusiveAntag: true
    roleType: SoloAntagonist
    subtype: cmu-role-subtype-arsonist
  - type: CMUAdminRoleIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: hudsquad_spec_pyro

- type: antag
  parent: CMUAntagColonyBase
  id: ArsonistRole
  name: cmu-antag-arsonist-name
  setPreference: true
  blacklistedGamemodes:
  - DistressSignal
  objective: cmu-antag-arsonist-objective

- type: startingGear
  id: CMUGearArsonist
  inhand:
  - RMCLighter
  # RuMC edit start
  equipment:
    back: CMUSatchelCLF
  storage:
    back:
    - RuMCCaseArsonistKit
  # RuMC edit end

# RuMC edit start
- type: entity
  parent: RMCGunCaseBase
  id: RuMCCaseArsonistKit
  suffix: Arsonist
  name: worn keepsake case
  description: A scuffed personal case that has clearly traveled a long way. The lock is worn from daily use.
  components:
  - type: Item
    size: Huge
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,7,3
  - type: StorageFill
    contents:
    - id: CMUWeaponArsonistFlamer
    - id: CMUTankFlamerPhoron
    - id: RMCGrenadeMolotov
      amount: 4
    - id: AU14MaskGasHAZOPSM17Flamer
    - id: CMUGasMaskFilterHAZOPS

# RuMC edit end
