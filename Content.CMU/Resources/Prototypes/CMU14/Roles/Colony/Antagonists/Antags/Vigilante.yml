- type: antagSpecifier
  id: Vigilante
  prefRoles: [ VigilanteRole ]
  jobBlacklistGroup:
  - RuMCNoColonialAntagsJobs # RuMC edit
  - RuMCLawJobs # RuMC edit
  - AllGovforJobs
  - AllOpforJobs
  - AllCLFJobs
# - AllColonyDepartmentHeadJobs
  briefing:
    text: cmu-antag-vigilante-greeting
    color: DarkRed
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  startingGear: CMUGearVigilante
  startingSkills:
    RMCSkillCqc: 2
    RMCSkillMeleeWeapons: 3
    RMCSkillPolice: 2
  components:
  - type: Vigilante
  - type: SynthGunAccess
  mindRoles:
  - MindRoleVigilante

- type: entity
  id: Vigilante
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:RandomAntagCount
      proto: Vigilante
      range:
        min: 1
        max: 2

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleVigilante
  name: Vigilante Mind Role
  components:
  - type: MindRole
    antagPrototype: VigilanteRole
    exclusiveAntag: true
    roleType: SoloAntagonist
    subtype: cmu-role-subtype-vigilante
  - type: CMUAdminRoleIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: cmb_dep

- type: antag
  parent: CMUAntagColonyBase
  id: VigilanteRole
  name: cmu-antag-vigilante-name
  setPreference: true
  blacklistedGamemodes:
  - DistressSignal
  objective: cmu-antag-vigilante-objective

- type: startingGear
  id: CMUGearVigilante
  # RuMC edit start
  storage:
    back:
    - RuMCCaseVigilanteKit
  # RuMC edit end

# RuMC edit start
- type: entity
  parent: RMCGunCaseBase
  id: RuMCCaseVigilanteKit
  suffix: Vigilante
  name: worn keepsake case
  description: A scuffed personal case that has clearly traveled a long way. The lock is worn from daily use.
  components:
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,1
  - type: StorageFill
    contents:
    - id: RMCMaskBalaclavaSkullBlack
    - id: CMUBaseballBatVigilante
    - id: RMCZipties
      amount: 2
# RuMC edit end

- type: entity
  parent: RMCBaseballBatMetal
  id: CMUBaseballBatVigilante
  name: inscribed metal baseball bat
  description: A heavy metal bat, balanced for breaking more than pitches. A single word, JUSTICE, is stamped into the grip.
  components:
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 42
