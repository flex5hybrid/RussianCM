- type: antagSpecifier
  id: BountyHunter
  prefRoles: [ BountyHunterRole ]
  jobBlacklistGroup:
  - RuMCNoColonialAntagsJobs # RuMC edit
  - RuMCLawJobs # RuMC edit
  - AllGovforJobs
  - AllOpforJobs
  - AllCLFJobs
  - AllWeYuJobs
  - AllColonyDepartmentHeadJobs
  briefing:
    text: cmu-antag-bounty-hunter-greeting
    color: Goldenrod
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  startingGear: CMUGearBountyHunter
  startingSkills:
    RMCSkillCqc: 2
    RMCSkillMeleeWeapons: 3
    RMCSkillPolice: 2
    RMCSkillFirearms: 2
  components:
  - type: BountyHunter
  - type: SynthGunAccess
  mindRoles:
  - MindRoleBountyHunter

- type: entity
  id: BountyHunter
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:RandomAntagCount
      proto: BountyHunter
      range:
        min: 1
        max: 2

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleBountyHunter
  name: Bounty Hunter Mind Role
  components:
  - type: MindRole
    antagPrototype: BountyHunterRole
    exclusiveAntag: true
    roleType: SoloAntagonist
    subtype: cmu-role-subtype-bounty-hunter
  - type: CMUAdminRoleIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: free_rfn

- type: antag
  parent: CMUAntagColonyBase
  id: BountyHunterRole
  name: cmu-antag-bounty-hunter-name
  setPreference: true
  blacklistedGamemodes:
  - DistressSignal
  objective: cmu-antag-bounty-hunter-objective

- type: startingGear
  id: CMUGearBountyHunter
  equipment:
    belt: AU14BeltBrowneFilled
    pocket1: RMCSpaceCash1000
    pocket2: RMCSpaceCash1000
  # RuMC edit start
  storage:
    back:
    - RuMCCaseBountyHunterKit
  # RuMC edit end

# RuMC edit start
- type: entity
  parent: RMCGunCaseBase
  id: RuMCCaseBountyHunterKit
  suffix: Bounty Hunter
  name: worn keepsake case
  description: A scuffed personal case that has clearly traveled a long way. The lock is worn from daily use.
  components:
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,11,3
  - type: StorageFill
    contents:
    - id: RuMCWeaponPistolGlock75BH
    - id: CMU14MagazinePistolGlock75HP
      amount: 2
    - id: CMU14MagazinePistolGlock75
      amount: 5
    - id: ClothingHandsGlovesNitrile
    - id: RMCSawtoothDaggerA
    - id: RMCMaskBalaclava
    - id: RMCGlassesTriMaxBlack

- type: entity
  parent: CMU14WeaponPistolGlock75Empty
  id: RuMCWeaponPistolGlock75BH
  suffix: Bounty Hunter
  components:
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        startingAttachable: RMCAttachmentSuppressor
      rmc-aslot-rail:
        startingAttachable: RMCAttachmentS5MicroRedDotSight
# RuMC edit end
