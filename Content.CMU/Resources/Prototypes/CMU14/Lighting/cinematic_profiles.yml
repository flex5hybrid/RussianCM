# Linear radiance is authored independently of native gameplay-light radius/energy.
# Saturated native alert colors are preserved by the neutral-only fixture tint.
- type: cmuCinematicLightProfile
  id: CMUFixture
  # Mount-relative art direction: ordinary downlight, warm reverse uplight, cold side utility.
  # Uses the actual local mounting rotation, never a map coordinate or camera direction.
  mountProfiles:
    East: CMUTechnicalFixture
    North: CMUIndustrial
    West: CMUTechnicalFixture
  color: "#F0E9DD"
  tint: 0.65
  threshold: 0.64
  core: 5
  emissionSize: 0.55, 0.10
  bloom: 1.1
  spill: 1.7
  reflection: 1.8
  radius: 3.6
  atmosphere: 0.045
  shape: Linear
  wallMounted: true
  falloff: 3.6
  indirect: 0.20
  innerGlow: 3.0
  outerGlow: 1.2
  emissionMask: CMUTubeMask

