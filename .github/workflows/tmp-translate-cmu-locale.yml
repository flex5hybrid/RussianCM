name: Translate newly synchronized CMU locale
on:
  push:
    branches: [chore/sync-cmu-ru-locale-20261028]
    paths: [.github/workflows/tmp-translate-cmu-locale.yml]
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Fluent parser and offline translation runtime
        run: pip install 'fluent.syntax>=0.19,<1' 'argostranslate>=1.9,<2'
      - name: Translate newly added messages without changing existing Russian
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import collections, pathlib, re, subprocess
          import argostranslate.package, argostranslate.translate
          from fluent.syntax import FluentParser, ast
          
          BASE = "5aa9f636251e2d762a7e2292d36c2aba89c7a7ff"
          ROOT = pathlib.Path("Content.CMU/Resources/Locale")
          RU, EN = ROOT / "ru-RU", ROOT / "en-US"
          entry_re = re.compile(r"^(-?[A-Za-z][A-Za-z0-9_-]*)[ \t]*=")
          attr_re = re.compile(r"^[ \t]+\.([A-Za-z][A-Za-z0-9_-]*)[ \t]*=")
          select_re = re.compile(r"^(\*?\[[^\]\n]+\][ \t]*)(.*)$")
          simple_line = re.compile(r"^(-?[A-Za-z][A-Za-z0-9_-]*|[ \t]+\.[A-Za-z][A-Za-z0-9_-]*)[ \t]*=[ \t]*(.*)$")
          protect_re = re.compile(
              r"https?://[^\s]+|<[^>]*>|\x60[^\x60]+\x60|\[(?:/?[A-Za-z][^\]\n]*)\]"
              r"|(?<!\w)(?:GOVFOR|OPFOR|USCM|UACM|UAAC|RMC|CMU|UPP|TWE|CLF|USMC|AN/PRC-117G)\b"
              r"|\b[A-Z]{1,5}[-/][A-Z0-9][-A-Z0-9/]*\b"
              r"|\b[A-Z]*\d+[A-Za-z0-9\-]*\b")
          short_terms = {"ON":"ВКЛ", "OFF":"ВЫКЛ", "YES":"ДА", "NO":"НЕТ", "NONE":"НЕТ",
              "UNKNOWN":"НЕИЗВЕСТНО", "AUTO":"АВТО", "BACK":"НАЗАД", "SAVE":"СОХРАНИТЬ",
              "CANCEL":"ОТМЕНА", "ENABLE":"ВКЛЮЧИТЬ", "DISABLE":"ОТКЛЮЧИТЬ",
              "SEND":"ОТПРАВИТЬ", "CLOSE":"ЗАКРЫТЬ", "OPEN":"ОТКРЫТЬ"}
          
          def read_base(path):
              res = subprocess.run(["git","show",f"{BASE}:{path.as_posix()}"],
                                   stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              return res.stdout.decode("utf-8") if res.returncode == 0 else None
          
          def member_ids(content):
              ids, active = {}, None
              for line in content.splitlines():
                  m = entry_re.match(line)
                  if m:
                      active = m.group(1)
                      ids.setdefault(active,set())
                  elif active:
                      a = attr_re.match(line)
                      if a: ids[active].add(a.group(1))
              return ids
          
          def get_simple_values(content):
              values = {}
              for line in content.splitlines():
                  m = simple_line.match(line)
                  if m and m.group(2).strip():
                      values[m.group(1).strip()] = m.group(2).strip()
              return values
          
          old_ids, old_attrs = set(), collections.defaultdict(set)
          paths = subprocess.check_output(
              ["git","ls-tree","-r","--name-only",BASE,"--",str(RU)],text=True).splitlines()
          original_files = {}
          for name in paths:
              if not name.endswith(".ftl"): continue
              base_text = read_base(pathlib.Path(name))
              if base_text is None: continue
              original_files[name] = base_text
              for key,attrs in member_ids(base_text).items():
                  old_ids.add(key)
                  old_attrs[key].update(attrs)
          print(f"Baseline Russian entries: {len(old_ids)} in {len(original_files)} files", flush=True)
          
          english_values = {}
          for path in EN.rglob("*.ftl"):
              english_values.update(get_simple_values(path.read_text(encoding="utf-8")))
          translations_by_text = collections.defaultdict(set)
          for source_text in original_files.values():
              for key,russian in get_simple_values(source_text).items():
                  english = english_values.get(key)
                  if english and re.search("[А-Яа-яЁё]",russian):
                      translations_by_text[english].add(russian)
          memory = {en:next(iter(ru)) for en,ru in translations_by_text.items()
                    if len(ru)==1 and len(en)<150}
          print(f"Translation memory: {len(memory)} established strings", flush=True)
          
          installed = argostranslate.translate.get_installed_languages()
          from_lang = next((x for x in installed if x.code=="en"),None)
          to_lang = next((x for x in installed if x.code=="ru"),None)
          if from_lang is None or to_lang is None:
              argostranslate.package.update_package_index()
              available = argostranslate.package.get_available_packages()
              pair = next((p for p in available if p.from_code=="en" and p.to_code=="ru"),None)
              if pair is None: raise RuntimeError("Argos en->ru model unavailable")
              argostranslate.package.install_from_path(pair.download())
              installed = argostranslate.translate.get_installed_languages()
              from_lang = next(x for x in installed if x.code=="en")
              to_lang = next(x for x in installed if x.code=="ru")
          translator = from_lang.get_translation(to_lang)
          print("Translation model initialized",flush=True)
          
          cache,counts = {},collections.Counter()
          def translate_simple(s):
              if not re.search("[A-Za-z]",s): return s
              if s in cache: return cache[s]
              if s in short_terms:
                  result = short_terms[s]; counts["short_terms"] += 1
              elif s in memory:
                  result = memory[s]; counts["memory"] += 1
              else:
                  result = translator.translate(s).strip(); counts["model"] += 1
              if not result or re.search(r"[\{\}]",result):
                  counts["unsafe_source_kept"] += 1
                  result=s
              cache[s]=result
              if len(cache)%250==0: print(f"Translation cache: {len(cache)} strings",flush=True)
              return result
          
          def protect_braces(s):
              result,pos=[],0
              while pos<len(s):
                  if s[pos]=="{":
                      nest,end=1,pos+1
                      while end<len(s) and nest>0:
                          if s[end]=="{": nest+=1
                          elif s[end]=="}": nest-=1
                          end+=1
                      result.append((True,s[pos:end]))
                      pos=end
                  else:
                      j=s.find("{",pos)
                      if j<0: j=len(s)
                      result.append((False,s[pos:j]));pos=j
              return result
          
          def translate_piece(piece):
              m=re.match(r"^([ \t]*)(.*?)([ \t]*)$",piece,flags=re.DOTALL)
              left,body,right=m.groups()
              if not re.search("[A-Za-z]",body): return piece
              return left+translate_simple(body)+right
          
          def translate_text(text):
              if not re.search("[A-Za-z]",text): return text
              m=re.match(r"^([ \t]*)(.*?)([ \t]*)$",text,flags=re.DOTALL)
              leading,core,trailing=m.groups()
              if not core or core.startswith("#"): return text
              variant=select_re.match(core)
              selector_prefix=""
              if variant: selector_prefix,core=variant.groups()
              segments=[]
              for protected,chunk in protect_braces(core):
                  if protected:
                      segments.append(chunk);continue
                  last=0
                  for match in protect_re.finditer(chunk):
                      if match.start()>last:
                          segments.append(translate_piece(chunk[last:match.start()]))
                      segments.append(match.group(0));last=match.end()
                  segments.append(translate_piece(chunk[last:]))
              return leading+selector_prefix+"".join(segments)+trailing
          
          def translate_line(line):
              stripped=line.rstrip("\r\n")
              suffix=line[len(stripped):]
              if not stripped or stripped.lstrip().startswith("#"): return line
              m=re.match(r"^([ \t]*)(.*)$",stripped)
              indentation,rest=m.groups()
              define=re.match(r"^(-?[A-Za-z][A-Za-z0-9_-]*|\.[A-Za-z][A-Za-z0-9_-]*)[ \t]*=",rest)
              if define:
                  equal_pos=rest.find("=")
                  out=indentation+rest[:equal_pos+1]+translate_text(rest[equal_pos+1:])+suffix
              else:
                  out=indentation+translate_text(rest)+suffix
              if out!=line: counts["changed_lines"]+=1
              return out
          
          def junk_count(content):
              resource=FluentParser().parse(content)
              return sum(isinstance(n,ast.Junk) for n in resource.body)
          
          changed_files,new_keys_seen=[],set()
          for path in sorted(RU.rglob("*.ftl")):
              original=path.read_text(encoding="utf-8")
              new_lines=[]
              current_key,current_attr,translate_current=None,None,False
              for line in original.splitlines(keepends=True):
                  m=entry_re.match(line)
                  if m:
                      current_key=m.group(1)
                      current_attr=None
                      translate_current=current_key not in old_ids
                      if translate_current: new_keys_seen.add(current_key)
                  else:
                      a=attr_re.match(line)
                      if a and current_key is not None:
                          current_attr=a.group(1)
                          translate_current=(current_key not in old_ids or
                                             current_attr not in old_attrs[current_key])
                          if current_key in old_ids and current_attr not in old_attrs[current_key]:
                              counts["new_attrs_seen"]+=1
                  new_lines.append(translate_line(line) if translate_current else line)
              updated="".join(new_lines)
              if updated!=original:
                  before_junk,after_junk=junk_count(original),junk_count(updated)
                  if after_junk>before_junk:
                      raise RuntimeError(f"New Fluent syntax error in {path}: {before_junk}->{after_junk}")
                  path.write_text(updated,encoding="utf-8")
                  changed_files.append(path)
          
          for filename,base_text in original_files.items():
              path=pathlib.Path(filename)
              if not path.exists(): raise RuntimeError(f"Original Russian file removed: {path}")
              existing=get_simple_values(base_text)
              now=get_simple_values(path.read_text(encoding="utf-8"))
              for key,value in existing.items():
                  if key in now and value!=now[key]:
                      raise RuntimeError(f"Original Russian translation changed: {path}:{key}")
          if len(new_keys_seen)<5800:
              raise RuntimeError(f"Expected 5897 new keys; saw {len(new_keys_seen)}")
          print(f"Translated new keys seen: {len(new_keys_seen)}",flush=True)
          print(f"New attributes seen: {counts['new_attrs_seen']}",flush=True)
          print(f"Files edited: {len(changed_files)}; lines changed: {counts['changed_lines']}",flush=True)
          print(f"Memory: {counts['memory']}, model: {counts['model']}, short labels: {counts['short_terms']}, English fallbacks: {counts['unsafe_source_kept']}",flush=True)
          print(f"Total unique segments: {len(cache)}",flush=True)
          PY
      - name: Verify and commit localized entries
        shell: bash
        run: |
          set -e
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Content.CMU/Resources/Locale/ru-RU
          git rm .github/workflows/tmp-translate-cmu-locale.yml
          git commit -m "feat(locale): translate synchronized CMU messages into Russian"
          git push origin HEAD:chore/sync-cmu-ru-locale-20261028
