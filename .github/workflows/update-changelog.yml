# CMU14 Begin: downstream changelog workflow.
name: Changelog

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches: [master]
  workflow_run:
    workflows: [Publish, Fast Publish]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      start_date:
        description: "Recover missing entries since an ISO-8601 date"
        type: string
      category:
        description: "Default category for local PRs without a changelog label"
        default: CMU
        type: choice
        options: [CMU, RMC14, Main, Maps, Admin, Rules]
      dry_run:
        description: "Preview without a commit, Discord messages, or journal writes"
        type: boolean
        default: true
      delivery_resolution:
        description: "After checking Discord, resolve an interrupted request"
        type: choice
        options: [none, retry, delivered]
        default: none
  workflow_call:
    inputs:
      assembly_only:
        type: boolean
        default: true
    outputs:
      changes_detected:
        value: ${{ jobs.update.outputs.changes_detected }}
      commit_hash:
        description: "Commit containing the assembled changelog"
        value: ${{ jobs.update.outputs.commit_hash }}

jobs:
  update:
    if: github.event_name != 'workflow_run' && (vars.DONT_UPDATE_CHANGELOG != 'true' || inputs.dry_run == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: update-changelog-${{ github.ref }}
      queue: max
    outputs:
      changes_detected: ${{ steps.assemble.outputs.changes_detected }}
      commit_hash: ${{ steps.assemble.outputs.commit_hash }}
    permissions:
      contents: write
      pull-requests: read
    env:
      PREVIEW: ${{ inputs.dry_run == true || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      CHANGELOG_CATEGORY: ${{ inputs.category || 'CMU' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_BASE_BRANCH: ${{ github.event.repository.default_branch }}
      START_DATE: ${{ inputs.start_date || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.dry_run == true || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) && github.sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests pyyaml

      - name: Collect and assemble the changelog
        id: assemble
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            previous=$(git log --first-parent -1 --format=%H --fixed-strings --grep='Auto-update changelog [skip ci]')
            python3 Tools/update_changelog_parts.py Resources/Changelog/Parts --all --ref HEAD --category "$CHANGELOG_CATEGORY"
            args=()
            if [[ -n "$previous" ]]; then
              args+=(--previous-ref "$previous")
            fi
            python3 Tools/update_changelog.py Resources/Changelog/CMU.yml Resources/Changelog/Parts \
              --all --repository "$GITHUB_REPOSITORY" "${args[@]}"
            git add -- Resources/Changelog
            if git diff --cached --quiet; then
              echo "changes_detected=false" >> "$GITHUB_OUTPUT"
              break
            fi
            if [[ "$PREVIEW" == "true" ]]; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              break
            fi

            git commit -m 'Auto-update changelog [skip ci]'
            if git push origin "HEAD:$GITHUB_REF"; then
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              break
            fi
            git fetch origin "$GITHUB_REF"
            if [[ "$attempt" == 3 || "$(git rev-parse FETCH_HEAD)" == "$(git rev-parse HEAD^)" ]]; then
              exit 1
            fi
            git reset --hard FETCH_HEAD
          done
          echo "commit_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preview Discord delivery
        if: env.PREVIEW == 'true' && inputs.assembly_only != true
        run: python3 Tools/actions_changelogs_since_last_run.py --dry-run --output discord-preview.md
        env:
          CHANGELOG_START_DATE: ${{ inputs.start_date || '' }}

      - uses: actions/upload-artifact@v7
        if: env.PREVIEW == 'true' && inputs.assembly_only != true
        with:
          name: discord-changelog-preview
          path: discord-preview.md
          if-no-files-found: error

  discord:
    name: Deliver to Discord
    needs: update
    if: >-
      !cancelled() && vars.DONT_UPDATE_CHANGELOG != 'true' && inputs.assembly_only != true &&
      inputs.dry_run != true && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.update.result == 'success' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: changelog-discord-delivery
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update.outputs.commit_hash || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests pyyaml

      - name: Send outstanding entries
        run: |
          args=()
          if [[ -n "$DELIVERY_RESOLUTION" && "$DELIVERY_RESOLUTION" != "none" ]]; then
            args+=(--resolve-ambiguous "$DELIVERY_RESOLUTION")
          fi
          python3 Tools/actions_changelogs_since_last_run.py "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_START_DATE: ${{ inputs.start_date || '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
          DELIVERY_RESOLUTION: ${{ inputs.delivery_resolution || 'none' }}
          PYTHONUNBUFFERED: '1'
# CMU14 End
