# CMU14 Begin: downstream changelog workflow.
name: Changelog

concurrency:
  group: ${{ inputs.diagnose_only == true && 'changelog-diagnose' || 'update-changelog' }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches: [master]
    paths:
      - Resources/Changelog/**
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: "Only test Mistral with a tiny fixed prompt: no changelog, commits or Discord"
        type: boolean
        default: false
      start_date:
        description: "Recover missing entries since ISO-8601 date; already delivered entries are skipped"
        required: false
        type: string
      category:
        description: "Category for local PRs (all six sections are sent to Discord)"
        required: false
        default: CMU
        type: choice
        options: [CMU, RMC14, Main, Maps, Admin, Rules]
      dry_run:
        description: "Preview only: no commit, Discord messages, or delivery journal writes"
        type: boolean
        default: true
      delivery_resolution:
        description: "Only after a paused request: check channel, then retry or confirm delivery"
        type: choice
        options: [none, retry, delivered]
        default: none
  workflow_call:
    inputs:
      start_date:
        required: false
        type: string
        default: ""
      category:
        required: false
        type: string
        default: CMU
      dry_run:
        required: false
        type: boolean
        default: false
      delivery_resolution:
        required: false
        type: string
        default: none
    outputs:
      changes_detected:
        value: ${{ jobs.update.outputs.changes_detected }}
      commit_hash:
        description: "Assembled changelog commit or original SHA"
        value: ${{ jobs.update.outputs.commit_hash }}

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install diagnostic dependency
        run: python3 -m pip install --disable-pip-version-check requests
      - name: Probe Mistral access without changelog or delivery
        run: python3 Tools/_CMU14/Changelog/changelog_mistral_diagnostics.py
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CHANGELOG_TRANSLATION_MODEL: ${{ vars.CHANGELOG_TRANSLATION_MODEL || 'mistral-small-latest' }}
          PYTHONUNBUFFERED: '1'

  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.DONT_UPDATE_CHANGELOG != 'true' && inputs.diagnose_only != true
    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}
      commit_hash: ${{ steps.resolve-ref.outputs.commit_hash }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Reusable callers may target a custom ref; previews may inspect it safely.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests pyyaml

      - name: Verify changelog tools
        run: python3 -m unittest discover -s Tools/_CMU14/Changelog -p 'test_changelog*.py'

      - name: Parse merged local PRs
        run: >-
          python3 Tools/update_changelog_parts.py Resources/Changelog/Parts
          --changelog-file Resources/Changelog/CMU.yml --category "$CHANGELOG_CATEGORY"
        env:
          CHANGELOG_CATEGORY: ${{ inputs.category || 'CMU' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_BRANCH: ${{ github.ref_name }}
          START_DATE: ${{ inputs.start_date || '' }}

      - name: Assemble changelog
        run: >-
          python3 Tools/update_changelog.py Resources/Changelog/CMU.yml
          Resources/Changelog/Parts --category "$CHANGELOG_CATEGORY" --all
        env:
          CHANGELOG_CATEGORY: ${{ inputs.category || 'CMU' }}

      - uses: stefanzweifel/git-auto-commit-action@v7.2.0
        id: auto-commit
        if: inputs.dry_run != true && github.ref_name == github.event.repository.default_branch
        with:
          file_pattern: Resources/Changelog/*.yml Resources/Changelog/Parts/*.yml
          commit_message: "Auto-update changelog [skip ci]"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Resolve changelog commit
        id: resolve-ref
        run: echo "commit_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Translation work is disposable/reusable; it is separate from delivery state.
      - name: Restore Russian translation progress
        id: translation-cache
        uses: actions/cache/restore@v5
        with:
          path: .tmp/changelog-translation-cache.json
          key: changelog-ru-v1-${{ github.repository_id }}-${{ hashFiles('Tools/_CMU14/Changelog/changelog-russian.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            changelog-ru-v1-${{ github.repository_id }}-${{ hashFiles('Tools/_CMU14/Changelog/changelog-russian.yml') }}-

      # Always inspect the journal, including when assembly changed nothing.
      # This picks up upstream YAML already committed by a merge and resumes failures.
      - name: Translate and deliver or preview
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" || "$CURRENT_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$DELIVERY_RESOLUTION" != "none" && -n "$DELIVERY_RESOLUTION" ]]; then
            args+=(--resolve-ambiguous "$DELIVERY_RESOLUTION")
          fi
          python3 Tools/actions_changelogs_since_last_run.py "${args[@]}" --output discord-preview.md
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_START_DATE: ${{ inputs.start_date || '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CHANGELOG_TRANSLATION_MODEL: ${{ vars.CHANGELOG_TRANSLATION_MODEL || 'mistral-small-latest' }}
          DELIVERY_RESOLUTION: ${{ inputs.delivery_resolution || 'none' }}
          CHANGELOG_TRANSLATION_CACHE: .tmp/changelog-translation-cache.json
          CHANGELOG_TRANSLATION_INTERVAL_SECONDS: ${{ vars.CHANGELOG_TRANSLATION_INTERVAL_SECONDS || '15' }}
          PYTHONUNBUFFERED: '1'

      - name: Save Russian translation progress even after failure
        if: always() && hashFiles('.tmp/changelog-translation-cache.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .tmp/changelog-translation-cache.json
          key: ${{ steps.translation-cache.outputs.cache-primary-key }}

      - name: Upload preview
        if: inputs.dry_run == true || github.ref_name != github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: discord-changelog-preview
          path: discord-preview.md
          if-no-files-found: error
# CMU14 End
