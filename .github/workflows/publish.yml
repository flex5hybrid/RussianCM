name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      use_changelog:
        description: Assemble changelog before packaging
        type: boolean
        default: false
  # schedule:
  #   - cron: '0 10 * * *'

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  AUDIO_REPO_TOKEN: ${{ secrets.AUDIO_REPO_TOKEN }}

jobs:
  changelog:
    uses: ./.github/workflows/update-changelog.yml
    if: inputs.use_changelog == true
    permissions:
      contents: write
      pull-requests: read

  publish_start:
    name: Start publish
    # CMU14 Begin: pin the entire release to the assembled changelog commit.
    needs: changelog
    if: >-
      !cancelled() &&
      (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
    # CMU14 End
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      already-published: ${{ steps.start.outputs.already-published }}
      ref: ${{ steps.checkout.outputs.commit }} # CMU14
    steps:
      - uses: actions/checkout@v7
        id: checkout # CMU14
        with:
          ref: ${{ needs.changelog.outputs.commit_hash || github.sha }} # CMU14
          persist-credentials: true
          submodules: false
          sparse-checkout: |
            RobustToolbox
            Tools

      - name: Checkout RobustToolbox
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth=1 RobustToolbox
          cd RobustToolbox
          git fetch --unshallow --tags origin

      - name: Start publish
        id: start
        run: python3 Tools/publish_multi_request.py start
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_VERSION: ${{ steps.checkout.outputs.commit }} # CMU14

  package:
    name: Package ${{ matrix.name }}
    needs: publish_start
    if: >-
      always() &&
      needs.publish_start.result == 'success' &&
      needs.publish_start.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            command: client
            restore: |
              dotnet restore Content.Packaging/Content.Packaging.csproj
              dotnet restore Content.Client/Content.Client.csproj

          - name: server-linux-x64
            command: server --platform linux-x64
            restore: dotnet restore Content.Server/Content.Server.csproj --runtime linux-x64 /p:TargetOs=Linux

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish_start.outputs.ref }} # CMU14
          persist-credentials: true
          submodules: false

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --depth=1

      - name: Checkout ColonialMarinesAudio
        if: ${{ env.AUDIO_REPO_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: AU-14/ColonialMarinesAudio
          token: ${{ env.AUDIO_REPO_TOKEN }}
          path: __audio-overlay

      - name: Rsync CMAudio into Resources
        if: ${{ env.AUDIO_REPO_TOKEN != '' }}
        run: |
          mkdir -p Content.CMU/Resources/Audio/CMU14/Private/
          rsync -a --delete \
            __audio-overlay/Resources/Audio/_CMU14/Private/ \
            Content.CMU/Resources/Audio/CMU14/Private/
          du -sh Content.CMU/Resources/Audio/CMU14/Private/
          rm -rf __audio-overlay

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json

      - name: Restore dependencies
        run: ${{ matrix.restore }}

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration ${{ env.CONFIGURATION }} --no-restore /m

      - name: Package ${{ matrix.name }}
        run: dotnet run --project Content.Packaging --configuration ${{ env.CONFIGURATION }} --no-build --no-restore -- ${{ matrix.command }} --no-restore

      - name: Upload ${{ matrix.name }} package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish_upload:
    name: Upload packages to Robust.Cdn
    needs: [publish_start, package]
    if: >-
      always() &&
      needs.publish_start.result == 'success' &&
      needs.publish_start.outputs.already-published != 'true' &&
      needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish_start.outputs.ref }} # CMU14
          submodules: false
          sparse-checkout: Tools

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Upload all packages to Robust.Cdn
        run: python3 Tools/publish_multi_request.py --upload-workers 1 upload release/*.zip
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_VERSION: ${{ needs.publish_start.outputs.ref }} # CMU14

  publish_finish:
    name: Finish publish
    if: >-
      always() &&
      needs.publish_start.result == 'success' &&
      needs.publish_start.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CMU14: an early finish aborts the CDN transaction before its files arrive.
    needs: [publish_start, package, publish_upload]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish_start.outputs.ref }} # CMU14
          persist-credentials: true
          submodules: false
          sparse-checkout: Tools

      - name: Publish version
        if: needs.package.result == 'success' && needs.publish_upload.result == 'success'
        run: python3 Tools/publish_multi_request.py finish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_VERSION: ${{ needs.publish_start.outputs.ref }} # CMU14

      - name: Abort incomplete publish
        if: needs.package.result != 'success' || needs.publish_upload.result != 'success'
        continue-on-error: true
        run: python3 Tools/publish_multi_request.py finish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_VERSION: ${{ needs.publish_start.outputs.ref }} # CMU14
