name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      use_changelog:
        description: Update changelog using default settings? (don't overdo)
        type: boolean
        default: false
  # schedule:
  #   - cron: '0 10 * * *'

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  AUDIO_REPO_TOKEN: ${{ secrets.AUDIO_REPO_TOKEN }}

jobs:
  changelog:
    uses: ./.github/workflows/update-changelog.yml
    if: inputs.use_changelog == true
    secrets: inherit
    permissions:
      contents: write

  publish_start:
    name: Start publish
    needs: changelog
    if: always() && (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
    runs-on: ubuntu-24.04-arm # CMU14: use the ARM pool for Python-only publish coordination
    timeout-minutes: 15
    outputs:
      already-published: ${{ steps.start.outputs.already-published }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: false
          sparse-checkout: Tools # CMU14: engine sources are not needed to resolve the version

      # CMU14 Begin: preserve git describe semantics without downloading engine file contents.
      - name: Fetch RobustToolbox version metadata
        run: |
          engine_commit=$(git rev-parse HEAD:RobustToolbox)
          engine_url=$(git config -f .gitmodules --get submodule.RobustToolbox.url)
          git init --bare RobustToolbox
          git -C RobustToolbox remote add origin "$engine_url"
          git -C RobustToolbox fetch --filter=blob:none --tags origin "$engine_commit"
          git -C RobustToolbox update-ref HEAD "$engine_commit"
      # CMU14 End

      # CMU14 Begin: install the publishing script dependency on the ARM image.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install publish dependencies
        run: python3 -m pip install --disable-pip-version-check requests
      # CMU14 End

      - name: Start publish
        id: start
        run: python3 Tools/publish_multi_request.py start
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

  package:
    name: Package ${{ matrix.name }}
    needs: [changelog, publish_start]
    if: >-
      always() &&
      (needs.changelog.result == 'success' || needs.changelog.result == 'skipped') &&
      needs.publish_start.result == 'success' &&
      needs.publish_start.outputs.already-published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            command: client
            restore: |
              dotnet restore Content.Packaging/Content.Packaging.csproj
              dotnet restore Content.Client/Content.Client.csproj

          - name: server-linux-x64
            command: server --platform linux-x64
            restore: dotnet restore Content.Server/Content.Server.csproj --runtime linux-x64 /p:TargetOs=Linux

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: false

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --depth=1

      - name: Checkout ColonialMarinesAudio
        if: ${{ env.AUDIO_REPO_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: AU-14/ColonialMarinesAudio
          token: ${{ env.AUDIO_REPO_TOKEN }}
          path: __audio-overlay

      - name: Rsync CMAudio into Resources
        if: ${{ env.AUDIO_REPO_TOKEN != '' }}
        run: |
          mkdir -p Content.CMU/Resources/Audio/CMU14/Private/
          rsync -a --delete \
            __audio-overlay/Resources/Audio/_CMU14/Private/ \
            Content.CMU/Resources/Audio/CMU14/Private/
          du -sh Content.CMU/Resources/Audio/CMU14/Private/
          rm -rf __audio-overlay

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json

      - name: Restore dependencies
        run: ${{ matrix.restore }}

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration ${{ env.CONFIGURATION }} --no-restore /m

      - name: Package ${{ matrix.name }}
        run: dotnet run --project Content.Packaging --configuration ${{ env.CONFIGURATION }} --no-build --no-restore -- ${{ matrix.command }} --no-restore

      - name: Upload ${{ matrix.name }} package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish_upload:
    name: Upload packages to Robust.Cdn
    needs: [publish_start, package]
    if: >-
      always() &&
      needs.publish_start.result == 'success' &&
      needs.publish_start.outputs.already-published != 'true' &&
      needs.package.result == 'success'
    runs-on: ubuntu-24.04-arm # CMU14: uploads do not require an x64 build runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          sparse-checkout: Tools

      # CMU14 Begin: install the publishing script dependency on the ARM image.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install publish dependencies
        run: python3 -m pip install --disable-pip-version-check requests
      # CMU14 End

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Upload all packages to Robust.Cdn
        run: python3 Tools/publish_multi_request.py --upload-workers 1 upload release/*.zip
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

  publish_finish:
    name: Finish publish
    if: >-
      always() &&
      needs.publish_start.result == 'success' &&
      needs.publish_start.outputs.already-published != 'true'
    runs-on: ubuntu-24.04-arm # CMU14: use the ARM pool for Python-only publish coordination
    timeout-minutes: 15
    needs: [publish_start, package, publish_upload]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: false
          sparse-checkout: Tools

      # CMU14 Begin: install the publishing script dependency on the ARM image.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install publish dependencies
        run: python3 -m pip install --disable-pip-version-check requests
      # CMU14 End

      - name: Publish version
        if: needs.package.result == 'success' && needs.publish_upload.result == 'success'
        run: python3 Tools/publish_multi_request.py finish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}

      - name: Abort incomplete publish
        if: needs.package.result != 'success' || needs.publish_upload.result != 'success'
        continue-on-error: true
        run: python3 Tools/publish_multi_request.py finish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
