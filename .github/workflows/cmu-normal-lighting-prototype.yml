name: CMU normal lighting prototype

on:
  pull_request:
    branches:
      - feat/cmu-generated-normal-maps
    paths:
      - 'Content.CMU/Client/Lighting/**'
      - 'Content.CMU/Shared/Lighting/**'
      - 'Content.CMU/Resources/Textures/Shaders/CMU14/Cinematic/**'
      - 'Content.CMU/Resources/Prototypes/CMU14/**'
      - 'Content.CMU/Resources/Textures/_GeneratedNormalMaps/**'
      - '.github/workflows/cmu-normal-lighting-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile CMU client with normal lighting
        run: dotnet build Content.Client/Content.Client.csproj --configuration DebugOpt -p:WarningLevel=0 -m
