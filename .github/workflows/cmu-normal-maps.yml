name: CMU normal map assets

on:
  pull_request:
    paths:
      - 'Resources/Textures/**'
      - 'Content.CMU/Resources/Textures/**'
      - 'Tools/normal_maps/**'
      - '.github/workflows/cmu-normal-maps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install -r Tools/normal_maps/requirements.txt
      - name: Test generator
        run: python -m unittest discover -s Tools/normal_maps -p 'test_*.py'
      - name: Validate committed maps for changed sources
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python Tools/normal_maps/generate.py --check --changed-from "$BASE_SHA"
