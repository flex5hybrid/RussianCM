- type: entity
  parent: AU14EncryptionKeyGovfor
  id: RUMCEncryptionKeyGovforMedical
  name: GOVFOR medical encryption key
  description: An encryption key used to communicate on the GOVFOR Medical channel.
  components:
  - type: EncryptionKey
    channels:
    - radioGovforMedical
    defaultChannel: radioGovforMedical

- type: entity
  parent: AU14HeadsetGovforMarine
  id: RUMCHeadsetGovforMarineMedical
  name: GOVFOR medical radio headset
  description: This is used by GOVFOR corpsmen to communicate on the radio.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - AU14EncryptionKeyGovfor
      - RUCMEncryptionKeyGovforMedical